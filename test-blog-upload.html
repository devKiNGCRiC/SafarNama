<!doctype html>
<html>
  <head>
    <title>Test Blog Upload</title>
  </head>
  <body>
    <h1>Test Blog Upload</h1>
    <form id="testForm">
      <input type="text" id="title" placeholder="Title" required /><br /><br />
      <textarea id="description" placeholder="Description" required></textarea
      ><br /><br />
      <input
        type="text"
        id="image"
        placeholder="Image URL"
        required
      /><br /><br />
      <input
        type="text"
        id="userId"
        placeholder="User ID"
        required
      /><br /><br />
      <button type="submit">Submit</button>
    </form>

    <script>
      document
        .getElementById("testForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const data = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            image: document.getElementById("image").value,
            user: document.getElementById("userId").value,
            excerpt: "",
            category: "Travel",
            tags: [],
          };

          console.log("Sending data:", data);

          try {
            const response = await fetch(
              "http://localhost:5000/api/v1/blog/create-blog",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              },
            );

            const result = await response.json();
            console.log("Response:", result);
            alert(
              `Result: ${result.success ? "Success!" : "Failed: " + result.message}`,
            );
          } catch (error) {
            console.error("Error:", error);
            alert("Error: " + error.message);
          }
        });
    </script>
  </body>
</html>
